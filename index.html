function azione(testo,fn,cls){const b=el('button',testo,async()=>{b.disabled=true;try{await fn()}catch(e){alert(messaggio(e))}b.disabled=false},cls);return b}
function campo(etichetta,pin){
  const i=el('input');i.type='password';i.placeholder=etichetta;i.autocomplete='off';i.setAttribute('aria-label',etichetta);
  if(pin){i.inputMode='numeric';i.maxLength=4;i.className='pin';i.oninput=()=>i.value=i.value.replace(/[^0-9]/g,'')}
  el('br');return i;
}
function invio(i,b){i.onkeydown=e=>{if(e.key==='Enter')b.click()}}

async function inizio(){
  PW='';S=[];pulisci(false); el('p','Caricamento...');
  let pronto,nomi;
  try{pronto=await api('bns_pronto'); if(pronto) nomi=await api('bns_nomi')}
  catch(e){pulisci();el('p','Non riesco a collegarmi.');azione('Riprova',inizio);return}
  if(!pronto) return apertura();
  pulisci(false);
  el('p','Scopri a chi devi fare il regalo');
  const sel=el('select');sel.setAttribute('aria-label','Il tuo nome');
  sel.add(new Option('Scegli il tuo nome...',''));
  nomi.forEach(n=>sel.add(new Option(n.nome,n.id)));
  el('br');
  sel.onchange=()=>{const x=nomi.find(n=>n.id==sel.value); if(x) accesso(x)};
  el('button','Area organizzatore',login,'rosso');
}
function accesso(x){
  pulisci();
  el('h2','Ciao '+x.nome+'!');
  el('p',x.ha_pin?'Inserisci il tuo PIN di 4 cifre':'Primo accesso: crea il tuo PIN di 4 cifre e ricordalo. Ti servirà per rivedere il nome.');
  if(x.ha_pin) el('p','Non hai mai creato un PIN? Avvisa Flavio.',null,'nota');
  const p1=campo('PIN',true), p2=x.ha_pin?null:campo('Ripeti il PIN',true);
  const ok=azione(x.ha_pin?'Mostra il mio nome':'Sono '+x.nome+': crea il PIN',async()=>{
    if(!/^[0-9]{4}$/.test(p1.value)) throw new Error('Il PIN deve essere di 4 cifre');
    if(p2&&p1.value!==p2.value) throw new Error('I due PIN sono diversi');
    const r=await api('bns_entra',{chi:x.id,pin:p1.value,crea:!x.ha_pin});
    risultato(x.nome,r.nome);
  });
  invio(p2||p1,ok);
  el('br'); el('button','Non sono '+x.nome+', torna indietro',inizio,'rosso');
  p1.focus();
}
function risultato(io,destinatario){
  pulisci(); window.scrollTo(0,0);
  const palco=document.createElement('div');palco.className='palco';document.body.appendChild(palco);
  const nodo=(dove,tag,testo,cls)=>{const e=document.createElement(tag);e.textContent=testo||'';if(cls)e.className=cls;dove.appendChild(e);return e};
  nodo(palco,'div',null,'raggi');
  const attesa=nodo(palco,'p','Stiamo aprendo il tuo regalo...','attesa');
  const scatola=nodo(palco,'div',null,'scatola');
  ['dentro','bagliore','corpo','coperchio'].forEach(c=>nodo(scatola,'div',null,c));
  timer=setTimeout(()=>{
    // 1) salta il coperchio ed esce la luce
    attesa.remove();scatola.classList.add('via');palco.classList.add('aperto');suonaMagia();
    timer=setTimeout(()=>{
      // 2) il biglietto sale dalla scatola
      const c=nodo(palco,'div',null,'biglietto');c.setAttribute('role','status');
      nodo(c,'p',io+', devi fare il regalo a');
      nodo(c,'div',destinatario,'big');
      nodo(c,'p','Budget: 15 € · massimo 20 €');
      nodo(c,'p','Acqua in bocca! Si chiude da solo dopo un minuto.','nota');
      nodo(c,'button','Ho letto, esci').onclick=inizio;
      const r=scatola.getBoundingClientRect(), k=c.offsetTop+c.offsetHeight/2;
      const giu=r.top+r.height*.6-k, scala=Math.min(.3,120/c.offsetWidth);
      if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&c.animate){
        c.animate([
          {transform:`translateY(${giu}px) scale(${scala}) rotate(-4deg)`,zIndex:1,offset:0},
          {transform:`translateY(${giu-190}px) scale(${scala*1.25}) rotate(5deg)`,zIndex:1,offset:.42},
          {transform:`translateY(${giu-200}px) scale(${scala*1.3}) rotate(5deg)`,zIndex:4,offset:.46},
          {transform:'translateY(-14px) scale(1.06) rotate(-1deg)',zIndex:4,offset:.85},
          {transform:'none',zIndex:4,offset:1}
        ],{duration:2100,easing:'ease-in-out'});
        scatola.classList.add('scende');
      } else scatola.remove();
      setTimeout(()=>{if(c.isConnected){coriandoli();scatola.remove()}},2000);
      timer=setTimeout(inizio,62000);
    },450);
  },1600);
}
function coriandoli(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  for(let i=0;i<70;i++){const c=document.createElement('span');c.className='coriandolo';
    c.style.background=['#ffd54a','#e5383b','#37b57a','#62c8ff','#fff'][i%5];
    c.style.setProperty('--x',(Math.random()*600-300)+'px');c.style.setProperty('--y',(Math.random()*600-320)+'px');
    document.body.appendChild(c);setTimeout(()=>c.remove(),1600)}
}
function apertura(){
  pulisci();
  el('p','L\'estrazione non è ancora aperta.');
  el('p','Solo per l\'organizzatore: crea la password (almeno 8 caratteri)',null,'nota');
  const p1=campo('Password'), p2=campo('Ripeti la password');
  invio(p2,azione('Apri l\'estrazione',async()=>{
    if(p1.value!==p2.value) throw new Error('Le due password sono diverse');
    await api('bns_crea_password',{pw:p1.value});
    PW=p1.value; await carica(); riepilogo();
  }));
}
function login(){
  pulisci(); el('h2','Area organizzatore');
  const p=campo('Password');
  invio(p,azione('Entra',async()=>{PW=p.value;await carica();riepilogo()}));
  el('br'); el('button','Torna indietro',inizio,'rosso');
}
async function carica(){S=(await api('bns_elenco',{pw:PW})).persone}
function riepilogo(){
  pulisci();
  const manca=S.filter(x=>!x.quando), fatti=S.filter(x=>x.quando);
  el('h2','Hanno estratto '+fatti.length+' su '+S.length);
  const barra=el('div',null,null,'barra'), pieno=document.createElement('i');
  pieno.style.width=(100*fatti.length/(S.length||1))+'%';barra.appendChild(pieno);
  el('h3','Mancano ('+manca.length+')');
  manca.forEach(x=>el('span',x.nome,null,'chip manca'));
  el('h3','Hanno già estratto ('+fatti.length+')');
  if(fatti.length) el('p','Clicca un nome solo se devi azzerare il suo PIN.',null,'nota');
  fatti.forEach(x=>el('button','✓ '+x.nome+' · '+x.quando,()=>azzera(x),'chip fatto'));
  el('p'); azione('Aggiorna',async()=>{await carica();riepilogo()},'secondario');
  el('button','Esci',inizio);
  el('br'); el('button','Annulla tutto e ricomincia',ricomincia,'rosso');
}
function azzera(x){
  pulisci(); el('h2','Azzerare il PIN di '+x.nome+'?');
  el('p','Dovrà crearne uno nuovo. Il nome estratto resta lo stesso.');
  azione('Sì, azzera il PIN',async()=>{await api('bns_azzera_pin',{pw:PW,chi:x.id});await carica();riepilogo()});
  el('button','No, torna indietro',riepilogo);
}
function ricomincia(){
  pulisci(); el('h2','Annullare tutto?');
  el('p','Cambiano gli abbinamenti e si cancellano tutti i PIN. Per confermare reinserisci la password.');
  const p=campo('Password');
  azione('Sì, rifai l\'estrazione',async()=>{await api('bns_ricomincia',{pw:p.value});await carica();riepilogo()});
  el('button','No, torna indietro',riepilogo);
}
// musica suonata dal browser, attiva di default
let audio=null, suona=true, ciclo=null;
const bMus=document.createElement('button');bMus.className='musica';bMus.textContent='♪ Musica: no';bMus.setAttribute('aria-pressed','false');document.body.appendChild(bMus);
function nota(midi,quando,durata,volume){
  const f=440*Math.pow(2,(midi-69)/12);
  [[1,1],[2.76,.22]].forEach(([m,v])=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f*m;
    g.gain.setValueAtTime(0,quando);g.gain.linearRampToValueAtTime(volume*v,quando+.01);g.gain.exponentialRampToValueAtTime(.0001,quando+durata/m);
    o.connect(g).connect(audio.destination);o.start(quando);o.stop(quando+durata)});
}
// Jingle Bells (J. Pierpont, 1857, pubblico dominio): [nota, durata in battiti]
const C=72,D=74,E=76,F=77,G=79;
const inizioRit=[[E,1],[E,1],[E,2],[E,1],[E,1],[E,2],[E,1],[G,1],[C,1.5],[D,.5],[E,4],[F,1],[F,1],[F,1.5],[F,.5],[F,1],[E,1],[E,1],[E,.5],[E,.5]];
const melodia=[...inizioRit,[E,1],[D,1],[D,1],[E,1],[D,2],[G,2],...inizioRit,[G,1],[G,1],[F,1],[D,1],[C,4]];
const bassi=[48,48,48,48,53,48,50,43,48,48,48,48,53,48,43,48];
function giro(){
  const q=.29, t=audio.currentTime+.06;
  let battito=0;
  melodia.forEach(([m,d])=>{nota(m,t+battito*q,Math.max(.45,d*q*1.5),.07);battito+=d});
  bassi.forEach((m,i)=>{for(let k=0;k<4;k++){
    const quando=t+(i*4+k)*q;
    nota(k%2?m+19:(k?m+7:m),quando,k%2?.25:.55,k%2?.018:.05);
    nota(108,quando,.12,.008); // campanellini
  }});
  ciclo=setTimeout(giro,(battito+1)*q*1000);
}
function suonaMagia(){if(suona&&audio)[86,90,93,98].forEach((m,i)=>nota(m,audio.currentTime+i*.09,1.4,.08))}
function parti(){
  if(!suona)return;
  if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();giro()}
  else if(audio.state!=='running')audio.resume();
}
function ferma(){clearTimeout(ciclo);if(audio){audio.close();audio=null}}
function etichetta(){bMus.textContent=suona?'♪ Musica: sì':'♪ Musica: no';bMus.setAttribute('aria-pressed',String(suona))}
bMus.onclick=()=>{suona=!suona;suona?parti():ferma();etichetta()};
// i browser permettono l'audio solo dopo un tocco: parte al primo gesto
['click','touchend','keydown'].forEach(t=>document.addEventListener(t,e=>{if(e.target!==bMus)parti()},true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)ferma()});
etichetta();
inizio();
for(let i=0;i<45;i++){const f=document.createElement('div');f.className='neve';f.textContent='❄';
f.style.cssText=`left:${Math.random()*100}vw;font-size:${8+Math.random()*18}px;opacity:${.25+Math.random()*.6};animation-duration:${7+Math.random()*10}s;animation-delay:-${Math.random()*17}s`;
document.body.appendChild(f)}
</script></body></html>

async function api(fn,dati){
  const r=await fetch(URL_API+fn,{method:'POST',headers:{apikey:CHIAVE,'Content-Type':'application/json'},body:JSON.stringify(dati||{})});
  if(!r.ok) throw new Error('Il server ha risposto '+r.status);
  const j=await r.json(); if(j&&j.errore) throw new Error(j.errore); return j;
}
function messaggio(e){return e instanceof TypeError?'Connessione assente: controlla internet.':e.message}
function pulisci(){clearTimeout(timer);app.innerHTML=''}
// blocca i doppi clic mentre aspetta il server
function azione(testo,fn,cls){const b=el('button',testo,async()=>{b.disabled=true;try{await fn()}catch(e){alert(messaggio(e))}b.disabled=false},cls);return b}
function campo(etichetta,pin){
  const i=el('input');i.type='password';i.placeholder=etichetta;i.autocomplete='off';i.setAttribute('aria-label',etichetta);
  if(pin){i.inputMode='numeric';i.maxLength=4;i.className='pin';i.oninput=()=>i.value=i.value.replace(/[^0-9]/g,'')}
  el('br');return i;
}
function invio(i,b){i.onkeydown=e=>{if(e.key==='Enter')b.click()}}

async function inizio(){
  PW='';S=[];pulisci(); el('p','Caricamento...');
  let pronto,nomi;
  try{pronto=await api('bns_pronto'); if(pronto) nomi=await api('bns_nomi')}
  catch(e){pulisci();el('p','Non riesco a collegarmi.');azione('Riprova',inizio);return}
  if(!pronto) return apertura();
  pulisci();
  el('p','Scopri a chi devi fare il regalo');
  const sel=el('select');sel.setAttribute('aria-label','Il tuo nome');
  sel.add(new Option('Scegli il tuo nome...',''));
  nomi.forEach(n=>sel.add(new Option(n.nome,n.id)));
  el('br');
  sel.onchange=()=>{const x=nomi.find(n=>n.id==sel.value); if(x) accesso(x)};
  el('button','Area organizzatore',login,'rosso');
}
function accesso(x){
  pulisci();
  el('h2','Ciao '+x.nome+'!');
  el('p',x.ha_pin?'Inserisci il tuo PIN di 4 cifre':'Primo accesso: crea il tuo PIN di 4 cifre e ricordalo. Ti servirà per rivedere il nome.');
  if(x.ha_pin) el('p','Non hai mai creato un PIN? Avvisa Flavio.',null,'nota');
  const p1=campo('PIN',true), p2=x.ha_pin?null:campo('Ripeti il PIN',true);
  const ok=azione(x.ha_pin?'Mostra il mio nome':'Sono '+x.nome+': crea il PIN',async()=>{
    if(!/^[0-9]{4}$/.test(p1.value)) throw new Error('Il PIN deve essere di 4 cifre');
    if(p2&&p1.value!==p2.value) throw new Error('I due PIN sono diversi');
    const r=await api('bns_entra',{chi:x.id,pin:p1.value,crea:!x.ha_pin});
    risultato(x.nome,r.nome);
  });
  invio(p2||p1,ok);
  el('br'); el('button','Non sono '+x.nome+', torna indietro',inizio,'rosso');
  p1.focus();
}
function risultato(io,destinatario){
  pulisci();
  el('p','Stiamo aprendo il tuo regalo...');
  const pacco=el('div',null,null,'pacco');pacco.appendChild(document.createElement('b'));pacco.appendChild(document.createElement('i'));
  timer=setTimeout(()=>{
    pulisci(); coriandoli();
    el('p',io+', devi fare il regalo a');
    el('div',destinatario,null,'big');
    el('p','Acqua in bocca! La schermata si chiude da sola dopo un minuto.',null,'nota');
    el('button','Ho letto, esci',inizio);
    timer=setTimeout(inizio,60000);
  },1700);
}
function coriandoli(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  for(let i=0;i<70;i++){const c=document.createElement('span');c.className='coriandolo';
    c.style.background=['#ffd54a','#e5383b','#37b57a','#62c8ff','#fff'][i%5];
    c.style.setProperty('--x',(Math.random()*600-300)+'px');c.style.setProperty('--y',(Math.random()*600-320)+'px');
    document.body.appendChild(c);setTimeout(()=>c.remove(),1600)}
}
function apertura(){
  pulisci();
  el('p','L\'estrazione non è ancora aperta.');
  el('p','Solo per l\'organizzatore: crea la password (almeno 8 caratteri)',null,'nota');
  const p1=campo('Password'), p2=campo('Ripeti la password');
  invio(p2,azione('Apri l\'estrazione',async()=>{
    if(p1.value!==p2.value) throw new Error('Le due password sono diverse');
    await api('bns_crea_password',{pw:p1.value});
    PW=p1.value; await carica(); riepilogo();
  }));
}
function login(){
  pulisci(); el('h2','Area organizzatore');
  const p=campo('Password');
  invio(p,azione('Entra',async()=>{PW=p.value;await carica();riepilogo()}));
  el('br'); el('button','Torna indietro',inizio,'rosso');
}
async function carica(){S=(await api('bns_elenco',{pw:PW})).persone}
function riepilogo(){
  pulisci();
  const manca=S.filter(x=>!x.quando), fatti=S.filter(x=>x.quando);
  el('h2','Hanno estratto '+fatti.length+' su '+S.length);
  const barra=el('div',null,null,'barra'), pieno=document.createElement('i');
  pieno.style.width=(100*fatti.length/(S.length||1))+'%';barra.appendChild(pieno);
  el('h3','Mancano ('+manca.length+')');
  manca.forEach(x=>el('span',x.nome,null,'chip manca'));
  el('h3','Hanno già estratto ('+fatti.length+')');
  if(fatti.length) el('p','Clicca un nome solo se devi azzerare il suo PIN.',null,'nota');
  fatti.forEach(x=>el('button','✓ '+x.nome+' · '+x.quando,()=>azzera(x),'chip fatto'));
  el('p'); azione('Aggiorna',async()=>{await carica();riepilogo()},'secondario');
  el('button','Esci',inizio);
  el('br'); el('button','Annulla tutto e ricomincia',ricomincia,'rosso');
}
function azzera(x){
  pulisci(); el('h2','Azzerare il PIN di '+x.nome+'?');
  el('p','Dovrà crearne uno nuovo. Il nome estratto resta lo stesso.');
  azione('Sì, azzera il PIN',async()=>{await api('bns_azzera_pin',{pw:PW,chi:x.id});await carica();riepilogo()});
  el('button','No, torna indietro',riepilogo);
}
function ricomincia(){
  pulisci(); el('h2','Annullare tutto?');
  el('p','Cambiano gli abbinamenti e si cancellano tutti i PIN. Per confermare reinserisci la password.');
  const p=campo('Password');
  azione('Sì, rifai l\'estrazione',async()=>{await api('bns_ricomincia',{pw:p.value});await carica();riepilogo()});
  el('button','No, torna indietro',riepilogo);
}
inizio();
for(let i=0;i<45;i++){const f=document.createElement('div');f.className='neve';f.textContent='❄';
f.style.cssText=`left:${Math.random()*100}vw;font-size:${8+Math.random()*18}px;opacity:${.25+Math.random()*.6};animation-duration:${7+Math.random()*10}s;animation-delay:-${Math.random()*17}s`;
document.body.appendChild(f)}
</script></body></html>

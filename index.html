.lista .voce:hover,.lista .voce:focus{background:#f9ebc6;transform:none}
.lista .voce::before{content:"✦";color:#c99a2e;margin-right:10px}
.palline-pin{display:block;margin:6px auto 2px}.palline-pin>span:first-child{display:block;font-size:14px;color:#7a665c}
.fila{position:relative;display:flex;justify-content:center;gap:18px;width:240px;margin:0 auto;padding:14px 0 6px}
.fila i{position:relative;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9d2c3 55%,#aaa190);box-shadow:0 3px 5px #0004;transition:transform .2s}
.fila i::before{content:"";position:absolute;left:13px;top:-7px;width:12px;height:9px;border-radius:3px;background:linear-gradient(#fff0ad,#b98416)}
.fila i.accesa{transform:scale(1.12);background:radial-gradient(circle at 35% 30%,#ffb3ad,#d9202b 55%,#7d0a14);box-shadow:0 0 14px 3px #ffcf4daa}
.fila i.accesa:nth-child(even){background:radial-gradient(circle at 35% 30%,#b6f5d2,#1f8f5c 55%,#0b4a30)}
#app .fila input.pin{position:absolute;inset:0;width:100%;max-width:none;height:100%;margin:0;padding:0;border:0;border-radius:14px;background:transparent;color:transparent;caret-color:transparent;font-size:16px;letter-spacing:0}
.fila:focus-within{outline:2px dashed #d4a843;border-radius:14px}
.biglietto{margin-top:14px}
.angolo{position:absolute;color:#8f6a1e;font-size:18px;line-height:1}.s1{left:15px;top:14px}.s2{right:15px;top:14px}.s3{left:15px;bottom:14px}.s4{right:15px;bottom:14px}
.firma-biglietto{margin-top:6px;font:italic 700 20px "Snell Roundhand","Segoe Script",cursive;color:#7d0a14}
.sigillo{position:absolute;left:50%;top:-24px;width:48px;height:48px;margin-left:-24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;color:#ffd98a;background:radial-gradient(circle at 35% 30%,#e0434c,#97101c 65%,#620710);box-shadow:0 3px 8px #0007,0 0 0 4px #8d0f1a}
.conto{width:fit-content;margin:8px auto 0;padding:6px 14px;border:1px solid #f7d879;border-radius:14px;color:#ffeab0;font-weight:700;font-size:15px}.conto small{display:block;font-weight:400}
.benvenuto,.benvenuto:hover,.benvenuto:active{position:fixed;inset:0;z-index:8;width:100%;height:100%;margin:0;padding:20px;border-radius:0;transform:none;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;background:radial-gradient(circle at 50% 45%,#27468a,#050b24 75%);color:#ffeab0}
.benvenuto .titolo{font:italic 700 clamp(23px,6.5vw,34px) Georgia,serif}
.busta{position:relative;display:block;margin-top:24px;width:min(300px,80vw);aspect-ratio:3/2;background:#8d0f1a;border-radius:8px;box-shadow:0 22px 40px #000a;perspective:700px;animation:galleggia 2.6s ease-in-out infinite}
.busta>span{position:absolute;display:block}
.lettera{left:7%;right:7%;top:8%;height:80%;z-index:1;padding-top:6%;border-radius:6px;background:#fff6dc;color:#8d0b17;font:700 19px/1.2 Georgia,serif;transition:transform .8s ease .55s}
.tasca{inset:0;z-index:2;border-radius:8px;background:linear-gradient(#c41c27,#9b101c);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.lembo{left:0;right:0;top:0;height:60%;z-index:3;background:linear-gradient(#e12f3a,#b3141f);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .55s ease,z-index 0s .3s}
.ceralacca{left:50%;top:60%;z-index:4;width:62px;height:62px;margin:-34px 0 0 -31px;border-radius:50%;line-height:62px;font-size:30px;color:#6e4a06;background:radial-gradient(circle at 35% 30%,#fff3b8,#e0ae38 60%,#9c6f12);box-shadow:0 4px 8px #0007;transition:opacity .25s,transform .25s}
.invito{font:600 18px system-ui,sans-serif;animation:luce 1s ease-in-out infinite alternate}
@keyframes galleggia{50%{translate:0 -10px}}
.apri .lembo{transform:rotateX(180deg);z-index:0}.apri .ceralacca{opacity:0;transform:scale(1.8)}.apri .lettera{transform:translateY(-78%)}.apri .invito{visibility:hidden}
.benvenuto.apri{animation:svanisce .5s ease 1.4s forwards;pointer-events:none}@keyframes svanisce{to{opacity:0}}
.scintilla{position:fixed;z-index:9;pointer-events:none;color:#ffe58a;text-shadow:0 0 8px #ffc93c;font-size:15px;animation:scintilla .7s ease-out forwards}
@keyframes scintilla{to{transform:translate(var(--x),var(--y)) rotate(200deg) scale(.2);opacity:0}}
@media(max-width:600px){.biglietto button,#app .biglietto button{width:calc(100% - 36px)}.palline-pin>span:first-child{margin-bottom:2px}.compatto .conto{display:none}.conto{font-size:13px;padding:4px 10px}#app .scelta{height:52px}.fila i{width:34px;height:34px}.firma-biglietto{font-size:18px}.fila{padding:12px 0 4px}}
@media(max-width:600px) and (max-height:600px){.firma-biglietto{display:none}.palline-pin>span:first-child{font-size:12px}.fila{padding:10px 0 2px}.fila i{width:28px;height:28px}#app .palline-pin{margin-top:2px}}
@media(prefers-reduced-motion:reduce){.busta,.invito{animation:none}}

<script>
const URL_API='https://zcykviesiinezzuyoprn.supabase.co/rest/v1/rpc/';
const CHIAVE='sb_publishable_NCMbolO_pS9v6EWQsoGEbw_c11nlTUL';
const app=document.getElementById('app');
let PW='', S=[], timer=null;
function el(tag,testo,fn,cls){const e=document.createElement(tag);e.textContent=testo||'';if(fn)e.onclick=fn;if(cls)e.className=cls;app.appendChild(e);return e}
async function api(fn,dati){
  const r=await fetch(URL_API+fn,{method:'POST',headers:{apikey:CHIAVE,'Content-Type':'application/json'},body:JSON.stringify(dati||{})});
  if(!r.ok) throw new Error('Il server ha risposto '+r.status);
  const j=await r.json(); if(j&&j.errore) throw new Error(j.errore); return j;
}
function messaggio(e){return e instanceof TypeError?'Connessione assente: controlla internet.':e.message}
function pulisci(compatto=true){clearTimeout(timer);app.innerHTML='';document.querySelectorAll('.palco,.velo').forEach(p=>p.remove());document.body.classList.toggle('compatto',compatto)}
// blocca i doppi clic mentre aspetta il server
function azione(testo,fn,cls){const b=el('button',testo,async()=>{b.disabled=true;try{await fn()}catch(e){alert(messaggio(e))}b.disabled=false},cls);return b}
function campo(etichetta,pin){
  const i=document.createElement('input');i.type='password';i.autocomplete='off';i.setAttribute('aria-label',etichetta);
  if(!pin){i.placeholder=etichetta;app.appendChild(i);el('br');return i}
  const box=el('label',null,null,'palline-pin'), titolo=document.createElement('span');titolo.textContent=etichetta;box.appendChild(titolo);
  const fila=document.createElement('span');fila.className='fila';box.appendChild(fila);
  const palle=[0,1,2,3].map(()=>fila.appendChild(document.createElement('i')));
  i.inputMode='numeric';i.maxLength=4;i.className='pin';fila.appendChild(i);
  i.oninput=()=>{i.value=i.value.replace(/[^0-9]/g,'').slice(0,4);palle.forEach((p,k)=>p.classList.toggle('accesa',k<i.value.length))};
  return i;
}
function invio(i,b){i.onkeydown=e=>{if(e.key==='Enter')b.click()}}

async function inizio(){
  PW='';S=[];pulisci(false); el('p','Caricamento...');
  let pronto,nomi;
  try{pronto=await api('bns_pronto'); if(pronto) nomi=await api('bns_nomi')}
  catch(e){pulisci();el('p','Non riesco a collegarmi.');azione('Riprova',inizio);return}
  if(!pronto) return apertura();
  pulisci(false);
  el('p','Scopri a chi devi fare il regalo');
  el('button','Scegli il tuo nome',()=>scegli(nomi),'scelta');
  el('br');
  el('button','Area organizzatore',login,'rosso');
}
function scegli(nomi){
  const velo=document.createElement('div');velo.className='velo';
  velo.innerHTML='<div class="foglio" role="dialog" aria-modal="true" aria-label="Scegli il tuo nome"><div class="testa"><strong>Chi sei?</strong><button type="button" class="chiudi" aria-label="Chiudi">✕</button></div><input type="search" class="cerca" placeholder="Cerca il tuo nome" aria-label="Cerca il tuo nome" autocomplete="off"><div class="lista"></div></div>';
  document.body.appendChild(velo);
  const cerca=velo.querySelector('.cerca'), lista=velo.querySelector('.lista');
  const semplice=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const riempi=()=>{
    lista.textContent='';
    const trovati=nomi.filter(n=>semplice(n.nome).includes(semplice(cerca.value)));
    trovati.forEach(n=>{const b=document.createElement('button');b.type='button';b.className='voce';b.textContent=n.nome;b.onclick=()=>accesso(n);lista.appendChild(b)});
    if(!trovati.length){const p=document.createElement('p');p.textContent='Nessun nome trovato';lista.appendChild(p)}
  };
  cerca.oninput=riempi;
  velo.querySelector('.chiudi').onclick=()=>velo.remove();
  velo.onclick=e=>{if(e.target===velo)velo.remove()};
  velo.onkeydown=e=>{if(e.key==='Escape')velo.remove()};
  riempi(); velo.querySelector('.chiudi').focus();
}
function accesso(x){
  pulisci();
  el('h2','Ciao '+x.nome+'!');
  el('p',x.ha_pin?'Inserisci il tuo PIN di 4 cifre':'Primo accesso: crea il tuo PIN di 4 cifre e ricordalo. Ti servirà per rivedere il nome.');
  if(x.ha_pin) el('p','Non hai mai creato un PIN? Avvisa Flavio.',null,'nota');
  const p1=campo('PIN',true), p2=x.ha_pin?null:campo('Ripeti il PIN',true);
  const ok=azione(x.ha_pin?'Mostra il mio nome':'Crea il PIN e scopri',async()=>{
    if(!/^[0-9]{4}$/.test(p1.value)) throw new Error('Il PIN deve essere di 4 cifre');
    if(p2&&p1.value!==p2.value) throw new Error('I due PIN sono diversi');
    const r=await api('bns_entra',{chi:x.id,pin:p1.value,crea:!x.ha_pin});
    risultato(x.nome,r.nome);
  });
  invio(p2||p1,ok);
  el('br'); el('button','Non sono '+x.nome+', torna indietro',inizio,'rosso');
  p1.focus();
}
function risultato(io,destinatario){
  pulisci(); window.scrollTo(0,0);
  const palco=document.createElement('div');palco.className='palco';document.body.appendChild(palco);
  const nodo=(dove,tag,testo,cls)=>{const e=document.createElement(tag);e.textContent=testo||'';if(cls)e.className=cls;dove.appendChild(e);return e};
  nodo(palco,'div',null,'raggi');
  const attesa=nodo(palco,'p','Stiamo aprendo il tuo regalo...','attesa');
  const scatola=nodo(palco,'div',null,'scatola');
  ['dentro','bagliore','corpo','coperchio'].forEach(c=>nodo(scatola,'div',null,c));
  timer=setTimeout(()=>{
    // 1) salta il coperchio ed esce la luce
    attesa.remove();scatola.classList.add('via');palco.classList.add('aperto');
    timer=setTimeout(()=>{
      // 2) il biglietto sale dalla scatola
      const c=nodo(palco,'div',null,'biglietto');c.setAttribute('role','status');
      nodo(c,'p',io+', devi fare il regalo a');
      nodo(c,'div',destinatario,'big');
      nodo(c,'p','Budget: 15 € · massimo 20 €');
      nodo(c,'p','Acqua in bocca! Si chiude da solo dopo un minuto.','nota');
      nodo(c,'button','Ho letto, esci').onclick=inizio;
      nodo(c,'div','By Flavio','firma-biglietto');
      ['s1','s2','s3','s4'].forEach(k=>nodo(c,'span','❖','angolo '+k));
      nodo(c,'span','★','sigillo');
      const r=scatola.getBoundingClientRect(), k=c.offsetTop+c.offsetHeight/2;
      const giu=r.top+r.height*.6-k, scala=Math.min(.3,120/c.offsetWidth);
      if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&c.animate){
        c.animate([
          {transform:`translateY(${giu}px) scale(${scala}) rotate(-4deg)`,zIndex:1,offset:0},
          {transform:`translateY(${giu-190}px) scale(${scala*1.25}) rotate(5deg)`,zIndex:1,offset:.42},
          {transform:`translateY(${giu-200}px) scale(${scala*1.3}) rotate(5deg)`,zIndex:4,offset:.46},
          {transform:'translateY(-14px) scale(1.06) rotate(-1deg)',zIndex:4,offset:.85},
          {transform:'none',zIndex:4,offset:1}
        ],{duration:2100,easing:'ease-in-out'});
        scatola.classList.add('scende');
      } else scatola.remove();
      setTimeout(()=>{if(c.isConnected){coriandoli();scatola.remove()}},2000);
      timer=setTimeout(inizio,62000);
    },450);
  },1600);
}
function coriandoli(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  for(let i=0;i<70;i++){const c=document.createElement('span');c.className='coriandolo';
    c.style.background=['#ffd54a','#e5383b','#37b57a','#62c8ff','#fff'][i%5];
    c.style.setProperty('--x',(Math.random()*600-300)+'px');c.style.setProperty('--y',(Math.random()*600-320)+'px');
    document.body.appendChild(c);setTimeout(()=>c.remove(),1600)}
}
function apertura(){
  pulisci();
  el('p','L\'estrazione non è ancora aperta.');
  el('p','Solo per l\'organizzatore: crea la password (almeno 8 caratteri)',null,'nota');
  const p1=campo('Password'), p2=campo('Ripeti la password');
  invio(p2,azione('Apri l\'estrazione',async()=>{
    if(p1.value!==p2.value) throw new Error('Le due password sono diverse');
    await api('bns_crea_password',{pw:p1.value});
    PW=p1.value; await carica(); riepilogo();
  }));
}
function login(){
  pulisci(); el('h2','Area organizzatore');
  const p=campo('Password');
  invio(p,azione('Entra',async()=>{PW=p.value;await carica();riepilogo()}));
  el('br'); el('button','Torna indietro',inizio,'rosso');
}
async function carica(){S=(await api('bns_elenco',{pw:PW})).persone}
function riepilogo(){
  pulisci();
  const manca=S.filter(x=>!x.quando), fatti=S.filter(x=>x.quando);
  el('h2','Hanno estratto '+fatti.length+' su '+S.length);
  const barra=el('div',null,null,'barra'), pieno=document.createElement('i');
  pieno.style.width=(100*fatti.length/(S.length||1))+'%';barra.appendChild(pieno);
  el('h3','Mancano ('+manca.length+')');
  manca.forEach(x=>el('span',x.nome,null,'chip manca'));
  el('h3','Hanno già estratto ('+fatti.length+')');
  if(fatti.length) el('p','Clicca un nome solo se devi azzerare il suo PIN.',null,'nota');
  fatti.forEach(x=>el('button','✓ '+x.nome+' · '+x.quando,()=>azzera(x),'chip fatto'));
  el('p'); azione('Aggiorna',async()=>{await carica();riepilogo()},'secondario');
  el('button','Esci',inizio);
  el('br'); el('button','Annulla tutto e ricomincia',ricomincia,'rosso');
}
function azzera(x){
  pulisci(); el('h2','Azzerare il PIN di '+x.nome+'?');
  el('p','Dovrà crearne uno nuovo. Il nome estratto resta lo stesso.');
  azione('Sì, azzera il PIN',async()=>{await api('bns_azzera_pin',{pw:PW,chi:x.id});await carica();riepilogo()});
  el('button','No, torna indietro',riepilogo);
}
function ricomincia(){
  pulisci(); el('h2','Annullare tutto?');
  el('p','Cambiano gli abbinamenti e si cancellano tutti i PIN. Per confermare reinserisci la password.');
  const p=campo('Password');
  azione('Sì, rifai l\'estrazione',async()=>{await api('bns_ricomincia',{pw:p.value});await carica();riepilogo()});
  el('button','No, torna indietro',riepilogo);
}
// musica suonata dal browser, attiva di default
let suona=true, player=null;
const bMus=document.createElement('button');bMus.className='musica';bMus.textContent='♪ Musica: no';bMus.setAttribute('aria-pressed','false');document.body.appendChild(bMus);
// Jingle Bells (J. Pierpont, 1857, pubblico dominio): [nota, durata in battiti]
const C=72,D=74,E=76,F=77,G=79;
const inizioRit=[[E,1],[E,1],[E,2],[E,1],[E,1],[E,2],[E,1],[G,1],[C,1.5],[D,.5],[E,4],[F,1],[F,1],[F,1.5],[F,.5],[F,1],[E,1],[E,1],[E,.5],[E,.5]];
const melodia=[...inizioRit,[E,1],[D,1],[D,1],[E,1],[D,2],[G,2],...inizioRit,[G,1],[G,1],[F,1],[D,1],[C,4]];
const bassi=[48,48,48,48,53,48,50,43,48,48,48,48,53,48,43,48];
// il brano viene preparato come file audio: sul telefono è più affidabile e si sente di più
function creaBrano(){
  const SR=22050, q=.29, campioni=new Float32Array(Math.round(SR*65*q));
  function nota(midi,inizio,durata,volume){
    const f=440*Math.pow(2,(midi-69)/12), da=Math.round(inizio*SR), n=Math.round(durata*SR);
    for(let i=0;i<n&&da+i<campioni.length;i++){
      const x=i/SR, inviluppo=Math.min(1,x/.01)*Math.exp(-4*x/durata)*Math.min(1,(durata-x)/.03);
      campioni[da+i]+=volume*inviluppo*(Math.sin(2*Math.PI*f*x)+.35*Math.sin(4*Math.PI*f*x)+(f*2.76<SR/2?.15*Math.sin(2*Math.PI*f*2.76*x):0));
    }
  }
  let battito=0;
  melodia.forEach(([m,d])=>{nota(m,battito*q,Math.max(.5,d*q*1.5),1);battito+=d});
  bassi.forEach((m,i)=>{for(let k=0;k<4;k++){
    const t=(i*4+k)*q;
    nota(k%2?m+19:(k?m+19:m+12),t,k%2?.25:.5,k%2?.22:.4);
    nota(108,t,.1,.06);
  }});
  let picco=0;for(const v of campioni)picco=Math.max(picco,Math.abs(v));
  const dati=new DataView(new ArrayBuffer(44+campioni.length*2));
  const scrivi=(p,t)=>[...t].forEach((l,i)=>dati.setUint8(p+i,l.charCodeAt(0)));
  scrivi(0,'RIFF');dati.setUint32(4,36+campioni.length*2,true);scrivi(8,'WAVEfmt ');
  dati.setUint32(16,16,true);dati.setUint16(20,1,true);dati.setUint16(22,1,true);dati.setUint32(24,SR,true);dati.setUint32(28,SR*2,true);dati.setUint16(32,2,true);dati.setUint16(34,16,true);
  scrivi(36,'data');dati.setUint32(40,campioni.length*2,true);
  campioni.forEach((v,i)=>dati.setInt16(44+i*2,Math.tanh(v/picco*3)/Math.tanh(3)*32000,true));
  return new Blob([dati],{type:'audio/wav'});
}
player=new Audio(URL.createObjectURL(creaBrano()));player.loop=true;player.preload='auto';player.setAttribute('playsinline','');

  const quando=new Date(SCAMBIO), giorno=d=>Date.parse(d.toLocaleDateString('en-CA',{timeZone:'Europe/Rome'}));
  const g=Math.round((giorno(quando)-giorno(new Date()))/864e5);
  const ora=quando.toLocaleString('it-IT',{timeZone:'Europe/Rome',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  box.textContent=g>1?'Mancano '+g+' giorni allo scambio dei regali':g===1?'Domani c\'è lo scambio dei regali!':g===0?'Oggi c\'è lo scambio dei regali!':'Buon Natale a tutti!';
